[package]
name = "ignis"
version = "0.1.0"
edition = "2024"

[dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory"] }
spin = { version = "0.12.3", features = ["lazy"] }

# No stack unwinding on bare metal: a panic just stops the kernel.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# Extra QEMU flags used by `cargo run` (via `bootimage runner`):
#   -serial stdio        → connect COM1 to this terminal
#   isa-debug-exit       → lets the kernel power off QEMU by writing to port 0xf4
#   zoom-to-fit          → screen contents scale up when the window is resized
#   -netdev user + e1000 → an Intel network card on QEMU's built-in virtual network
#                          (we are 10.0.2.15, QEMU's virtual router is 10.0.2.2)
#   filter-dump          → record every network frame to target/net.pcap (open in Wireshark)
[package.metadata.bootimage]
run-args = [
    "-serial", "stdio",
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x01",
    "-display", "cocoa,zoom-to-fit=on",
    "-netdev", "user,id=net0",
    "-device", "e1000,netdev=net0",
    "-object", "filter-dump,id=dump0,netdev=net0,file=target/net.pcap",
]
